<!--
  DESIGN 7.1.4 / 9.9: the theme bootstrap is a separate first-party file loaded
  render-blocking here, BEFORE the stylesheet, and never inlined - script-src 'self'
  blocks inline scripts, and parser-blocking is what preserves the no-flash guarantee
  (parity 109).

  Nothing in this file may be inlined - no inline script element, no stylesheet element,
  no styling attribute - and test/viewer-http.test.js asserts exactly that against the
  committed dist. Note that those assertions grep the HTML text, so this comment must not
  spell any of those tag names out either.
-->
<script src="./boot-theme.js"></script>
</head>

<script type="module" src="./src/main.tsx"></script>
</body>
