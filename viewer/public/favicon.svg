<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The flowition mark: the wordmark's accented "w" (App.tsx: flo[w]ition), drawn as
       strokes in the §3.5 sprite idiom. 2px rather than the sprite's 1.5 - a tab
       favicon renders at 16 real pixels and the brand mark has to survive that.
       Presentation ATTRIBUTES only: check-dist.mjs enforces the §7.1.4 no-inline-style
       policy over every shipped .svg, so no style element and no media query here. One
       mid-tone reading of the accent hue (the light/dark accent tokens are
       oklch 0.5/0.72 0.15/0.13 255) that stays legible on both tab-strip palettes. -->
  <path d="M2.5 5.5 L5.5 11 L8 6.5 L10.5 11 L13.5 5.5" fill="none"
        stroke="oklch(0.62 0.14 255)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
